name: Update Org Overview Table

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-org-table
  cancel-in-progress: true

jobs:

  refresh-table:

    runs-on: ubuntu-latest

    steps:

      - name: Check out the .github repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build table and update README
        uses: actions/github-script@v8

        with:
          script: |
            const repos = [
              "parker-group/public-overview",
              "parker-group/NTL_conflict",
              "parker-group/DireDawa_Seroepi",
              "parker-group/Kinshasa_EO",
              "parker-group/SDEtool",
              "parker-group/parker-lab-values",
              "parker-group/parker-group.github.io",
            ];

            const fallbacks = {
              "parker-group/SDEtool":
                "R toolkit for standard deviational ellipses",

              "parker-group/parker-lab-values":
                "Shared lab values, norms, and practices",

              "parker-group/parker-group.github.io":
                "Group website (GitHub Pages)",

              "parker-group/NTL_conflict":
                "Nighttime lights data with conflict overlays",

              "parker-group/Kinshasa_EO":
                "Earth observation workflows for Kinshasa",

              "parker-group/DireDawa_Seroepi":
                "Sero-epidemiology analysis for Dire Dawa",

              "parker-group/public-overview":
                "Index of Parker Group projects & resources"
            };

            const rows = [];

            for (const full of repos) {

              const [owner, repo] =
                full.split("/");

              const { data } =
                await github.rest.repos.get({
                  owner,
                  repo
                });

              const desc =
                (data.description &&
                 data.description.trim()) ||
                fallbacks[full] ||
                "";

              const pushed =
                new Date(data.pushed_at);

              const dateStr =
                `${pushed.getUTCFullYear()}-${
                  String(
                    pushed.getUTCMonth()+1
                  ).padStart(2,"0")
                }-${
                  String(
                    pushed.getUTCDate()
                  ).padStart(2,"0")
                }`;

              rows.push(
                `| [${data.name}](${data.html_url}) | ${desc} | ${dateStr} |`
              );

            }

            const fs =
              require("fs");

            const path =
              "profile/README.md";

            const readme =
              fs.readFileSync(
                path,
                "utf8"
              );

            const regex =
              /<!-- REPO_TABLE_START -->[\s\S]*?<!-- REPO_TABLE_END -->/;

            const replacement =
              [
                "<!-- REPO_TABLE_START -->",
                "| Repository | Description | Last Updated |",
                "|------------|-------------|--------------|",
                ...rows,
                "<!-- REPO_TABLE_END -->"
              ].join("\n");

            const newReadme =
              readme.replace(
                regex,
                replacement
              );

            if (
              newReadme !== readme
            ) {

              fs.writeFileSync(
                path,
                newReadme
              );

            }

      - name: Commit changes (if any)

        run: |

          if [[ -n "$(git status --porcelain)" ]]; then

            git config user.name \
              "github-actions[bot]"

            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add profile/README.md

            git commit \
              -m "chore(profile): refresh org repo table"

            for i in {1..3}; do

              echo "Attempt $i"

              git pull \
                --rebase \
                origin \
                main

              if git push origin HEAD:main; then
                exit 0
              fi

              sleep 5

            done

            exit 1

          else

            echo \
              "No changes to commit."

          fi
